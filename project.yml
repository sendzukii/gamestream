name: GameStream
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    CODE_SIGNING_ALLOWED: NO
targets:
  GameStream:
    type: application
    platform: iOS
    sources:
      - path: Sources/GameStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GameStream
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Network.framework
      - sdk: GameController.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
